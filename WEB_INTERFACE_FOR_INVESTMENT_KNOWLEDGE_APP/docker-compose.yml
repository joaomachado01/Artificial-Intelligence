# DOCKER COMPOSE
# Run with:  docker compose up --build
services:

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  indexer:
    image: investment-rag:1.0
    build: .
    command: ["python", "index_entrypoint.py"]
    environment:
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant

  api:
    image: investment-rag:1.0
    command: ["python", "investment_start_api.py"]
    environment:
      QDRANT_URL: http://qdrant:6333
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      indexer:
        condition: service_completed_successfully

  web:
    image: investment-rag:1.0
    command: ["streamlit", "run", "investment_web_app.py",
              "--server.address", "0.0.0.0", "--server.port", "8501"]
    environment:
      API_URL: http://api:8000/invest_api
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  qdrant_data: